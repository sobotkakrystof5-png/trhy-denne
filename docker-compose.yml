# Jen pro vývoj. Postgres a proxy, která napodobuje HTTP a WebSocket
# rozhraní Neonu, takže aplikace lokálně běží se stejným ovladačem
# (@neondatabase/serverless) jako v produkci. Postup podle
# https://neon.com/guides/local-development-with-neon
#
# Hesla tady nejsou tajemství: databáze poslouchá jen na 127.0.0.1.
services:
  postgres:
    image: postgres:17
    command: "-d 1"
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:54329:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=main
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      - PG_CONNECTION_STRING=postgres://postgres:postgres@postgres:5432/main
    ports:
      - "127.0.0.1:4444:4444"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db_data:
